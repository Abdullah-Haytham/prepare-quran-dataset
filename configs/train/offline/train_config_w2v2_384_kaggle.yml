# Kaggle 2x T4 variant of train_config_w2v2_384.yml
# Launch with: bash kaggle/run_kaggle.sh
train_moshaf_ids:
  - "0.0"
  - "0.1"
  - "0.2"
  - "0.3"
  - "1.0"
  - "2.0"
  - "2.1"
  - "3.0"
  - "4.0"
  - "5.0"
  - "6.0"
  - "7.0"
  - "8.0"
  - "9.0"
  - "11.0"
  - "12.0"
  - "13.0"
  - "22.0"
  - "24.0"
  - "26.0"
  - "27.0"
  - "28.0"
  # - "29.0"
  # - "30.0"

# Kaggle disk can't hold all 22 moshafs (~87 GB download), so each run trains one
# epoch on one group (~10-13 GB) and resumes from the previous run's checkpoint.
# Total runs = 7 groups * num_epochs; after every 7 runs (one epoch) the model is
# copied to <output_dir>/epoch-NN (and pushed to the hub folder epoch-NN with --push-to-hub). Progress is kept in <output_dir>/rotation_state.json
train_moshaf_groups:
  - ["0.2", "3.0", "11.0"]
  - ["2.0", "0.0", "27.0"]
  - ["0.1", "1.0", "9.0"]
  - ["6.0", "5.0", "22.0"]
  - ["0.3", "7.0", "24.0"]
  - ["12.0", "2.1", "8.0"]
  - ["13.0", "4.0", "26.0", "28.0"]

# Test moshaf IDs (optional)
test_moshaf_ids:
  - "19.0"
  - "29.0"
  - "30.0"
  # - "26.1"


# Loss
loss_weights:
  phonemes: 0.5789
  shidda_or_rakhawa: 0.05263
  tafkheem_or_taqeeq: 0.05263


# Augmentaion
augment_prob: 0.4
max_audio_seconds: 20.0

# Model dropout
dropout: 0.0

# Model architecture (defaults match w2v-bert-2.0)
num_hidden_layers: 16
hidden_size: 384
output_hidden_size: 384
intermediate_size: 1536
num_attention_heads: 6

# Training parameters
num_epochs: 10
learning_rate: 5e-5
seed: 42

# Batch sizes
per_device_train_batch_size: 8
pre_device_eval_batch_size: 8

# Dataset parameters
devset_ratio: 0.1
save_every: 1.0  # evaluate/save once at the end of each rotation run

# Hardware settings
# Kaggle has 4 vCPUs shared by 2 GPU processes (collator decodes + augments on CPU)
num_workers: 2
# dataset download/filtering uses all 4 CPUs (runs once before training)
data_num_proc: 4

# T4 has no bf16 support
mixed_precision: fp16

# Optimizer settings
weight_decay: 0.00
warmup_ratio: 0.2

# Model saving and evaluation
metric_for_bet_model: "average_per"
greater_is_better: false

hub_model_id: "obadx/muaalem-model-w2v2-384"
wandb_project_name: "muaalem-model-w2v2-384"

# Architecture selection: w2v2bert (Wav2Vec2Bert) or w2v2 (Wav2Vec2)
architecture: w2v2bert  # pruned from obadx/muaalem-model-v3_2 (wav2vec2-bert)

# Base model weights ID or path (backbone)
base_model_name_or_path: "./w2v2-384"

# Processor/feature extractor ID or path
processor_name_or_path: "./w2v2-384"

# Ignore mismatched sizes when loading pretrained weights
ignore_mismatched_sizes: false

# Gradint checkpointing
gradient_checkpoiniting: true

# Output directory for checkpoints
output_dir: "/kaggle/working/results-w2v2-384"

# Google Drive links (one per file) downloaded before training; existing files are skipped.
# Share each file as "Anyone with the link" and replace <ID> with the full share link.
gdrive_files:
  ./w2v2-384:
    config.json: "https://drive.google.com/file/d/<ID>/view?usp=sharing"
    model.safetensors: "https://drive.google.com/file/d/<ID>/view?usp=sharing"
    preprocessor_config.json: "https://drive.google.com/file/d/<ID>/view?usp=sharing"
  # vocab.json is already in the repo; uncomment to override it from Drive
  # ./:
  #   vocab.json: "https://drive.google.com/file/d/<ID>/view?usp=sharing"
