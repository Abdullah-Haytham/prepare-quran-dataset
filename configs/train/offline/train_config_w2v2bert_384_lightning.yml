# Lightning AI (1x L4, bf16) config for the pruned wav2vec2-bert 384 model
# (pruned from obadx/muaalem-model-v3_2). Launch with: bash lightning/run_lightning.sh
train_moshaf_ids:
  - "0.0"
  - "0.1"
  - "0.2"
  - "0.3"
  - "1.0"
  - "2.0"
  - "2.1"
  - "3.0"
  - "4.0"
  - "5.0"
  - "6.0"
  - "7.0"
  - "8.0"
  - "9.0"
  - "11.0"
  - "12.0"
  - "13.0"
  - "22.0"
  - "24.0"
  - "26.0"
  - "27.0"
  - "28.0"
  # - "29.0"
  # - "30.0"

# Test moshaf IDs (optional)
test_moshaf_ids:
  - "19.0"
  - "29.0"
  - "30.0"
  # - "26.1"


# Loss
loss_weights:
  phonemes: 0.5789
  shidda_or_rakhawa: 0.05263
  tafkheem_or_taqeeq: 0.05263


# Augmentaion
augment_prob: 0.4
max_audio_seconds: 20.0

# Model dropout
dropout: 0.0

# Model architecture (defaults match w2v-bert-2.0)
num_hidden_layers: 24
hidden_size: 384
output_hidden_size: 384
intermediate_size: 1536
num_attention_heads: 6

# Training parameters
num_epochs: 30
learning_rate: 5e-5
seed: 42

# Batch sizes
# L4 (22 GB usable): w2v-bert attention is eager with relative positions, so each layer
# keeps batch x heads x T x T scores (T ~ 1000 frames for 20 s). Without gradient
# checkpointing batch 16 runs out of memory; with it, only one layer's activations live
# at a time. If memory stays < ~60% on long batches, try 24-32.
per_device_train_batch_size: 16
pre_device_eval_batch_size: 16

# Dataset parameters
devset_ratio: 0.1
save_every: 0.2  # unused with save_strategy: epoch

# Evaluate + save every epoch; each epoch's model is kept in <output_dir>/epoch-NN
# (and pushed to the hub folder epoch-NN with --push-to-hub)
save_strategy: epoch
logging_steps: 50

# Hardware settings
# The collator decodes + augments audio on CPU: usually the bottleneck for a model
# this small. null -> min(cpu_count, batch size). Dataset prep uses the same.
num_workers: null

mixed_precision: bf16
# bf16 has no GradScaler: drop infinite CTC losses (targets longer than the output
# frames) instead of letting them NaN the weights (train.py also skips non-finite steps)
ctc_zero_infinity: true

# Optimizer settings
weight_decay: 0.00
warmup_ratio: 0.2

# Model saving and evaluation
metric_for_bet_model: "average_per"
greater_is_better: false

hub_model_id: "AbdullahHedeya/muaalem-model-w2v2bert-384"
wandb_project_name: "muaalem-model-w2v2bert-384"

# Architecture selection: w2v2bert (Wav2Vec2Bert) or w2v2 (Wav2Vec2)
architecture: w2v2bert

# Base model weights ID or path (backbone)
base_model_name_or_path: "./w2v2bert-384"

# Processor/feature extractor ID or path
processor_name_or_path: "./w2v2bert-384"  # SeamlessM4TFeatureExtractor

# Ignore mismatched sizes when loading pretrained weights
ignore_mismatched_sizes: false

# Gradint checkpointing
gradient_checkpoiniting: true  # required on L4: batch 16 without it runs out of memory

# Output directory for checkpoints
output_dir: "./results-w2v2bert-384"

# Google Drive links (one per file), downloaded before training; existing files are skipped
gdrive_files:
  ./w2v2bert-384:
    config.json: "https://drive.google.com/file/d/11L8pAC3djjzdzOhjeT9yJZRY4LQC7XAQ/view?usp=drive_link"
    model.safetensors: "https://drive.google.com/file/d/1ExzgcmLpfB41Hq2nIxHWvluHDniWkccD/view?usp=drive_link"
    preprocessor_config.json: "https://drive.google.com/file/d/1p36WQY5zf8GVXHjqm7qM-C9SMnQtnvb3/view?usp=sharing"
